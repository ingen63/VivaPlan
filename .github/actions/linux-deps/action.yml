name: Linux-Abhängigkeiten
description: Systempakete, die Tauri (WebKitGTK) und die Pakete unter Linux brauchen. Einzige Stelle für die Liste.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
          libayatana-appindicator3-dev librsvg2-dev patchelf rpm
