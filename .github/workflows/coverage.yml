# Harte Absicherung: Push/PR schlägt fehl, wenn die Abdeckung von Engine oder App unter der Schwelle in tools/coverage-min (80 %) liegt.
# Tests laufen mit nextest wie in make test, im pre-push-Hook und in test-quality.yml: jeder Test in einem eigenen Prozess.
# Unter cargo test teilen sich parallele Tests den prozessweiten Fortschritt und Abbruch (crates/engine/src/progress.rs).
name: Tests & Coverage

on:
  push:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-22.04      # wie pakete.yml; ubuntu-latest ist inzwischen 26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-llvm-cov,nextest" }
      - uses: Swatinem/rust-cache@v2
      - name: Engine - Abdeckungsschwelle
        run: cargo llvm-cov nextest -p vivaplan-engine --all-features --fail-under-lines "$(cat tools/coverage-min)" --summary-only
      - name: App - Abdeckungsschwelle
        run: cargo llvm-cov nextest -p vivaplan-app --all-features --fail-under-lines "$(cat tools/coverage-min)" --summary-only
