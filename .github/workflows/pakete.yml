# Baut die Installationspakete: Windows (.msi, .exe), Linux (.deb, .AppImage; .rpm nur ohne Vorabversion) und macOS
# (.dmg, dazu das Ein-Klick-Paket .mcpb für Claude Desktop, #213). Ein Versions-Tag (v0.3.0) baut alle drei und legt
# einen Entwurf unter «Releases» an, mit den Release Notes in vier Sprachen (#188, #203) und den signierten
# Update-Dateien samt Manifest latest.json für die Update-Suche der App (#309). Von Hand (Actions →
# «Installationspakete» → Run workflow, oder `gh workflow run pakete.yml -f tag=v1.0.0-beta.3 -f plattformen=windows,linux`)
# baut nur die gewählten Plattformen (Vorgabe macOS, spart Actions-Minuten, #202): mit «tag» den Stand dieses Tags, die
# Pakete kommen in dessen Release-Entwurf; ohne «tag» den Stand des gewählten Zweigs, nur als Artefakte.
name: Installationspakete

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versions-Tag (z. B. v1.0.0-beta.3); leer = Stand des Zweigs, nur Artefakte"
        required: false
        default: ""
      plattformen:
        description: "Plattformen, durch Komma getrennt: macos, windows, linux"
        required: false
        default: "macos"

env:
  # Tag des Laufs: beim Tag-Push der Ref, von Hand die Eingabe «tag» (leer = kein Release)
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  # #203: Matrix der Plattformen; Tag-Push alle drei, von Hand die Eingabe «plattformen»
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      include: ${{ steps.m.outputs.include }}
    steps:
      - id: m
        env:
          WANTED: ${{ github.event_name == 'push' && 'macos,windows,linux' || inputs.plattformen }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          runners = {"macos": "macos-latest", "windows": "windows-latest", "linux": "ubuntu-22.04"}
          wanted = [w.strip().lower() for w in os.environ["WANTED"].split(",") if w.strip()]
          unknown = [w for w in wanted if w not in runners]
          if unknown or not wanted:
              raise SystemExit(f"unbekannte oder keine Plattform: {unknown or wanted}; erlaubt: macos, windows, linux")
          print("include=" + json.dumps([{"name": w, "os": runners[w]} for w in dict.fromkeys(wanted)]))
          PY

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      # #188/AK7: ohne Release Notes der Version in allen vier Sprachen bricht der Paketbau hier ab.
      - name: Release Notes der Version
        if: env.TAG != ''
        run: |
          python3 tools/changelog.py check
          python3 tools/changelog.py notes "$TAG" > /dev/null
          python3 tools/changelog.py title "$TAG"
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: "nextest" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run --workspace

  pakete:
    needs: [matrix, test]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - name: Linux-Abhängigkeiten
        if: matrix.name == 'linux'
        uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/app/package-lock.json
      - run: npm ci
        working-directory: crates/app
      # RPM erlaubt in der Version keinen Bindestrich: bei Vorabversionen (1.0.0-beta.1) entfällt das .rpm. Massgebend
      # ist die Version der App, nicht der Name des Tags (#141: beim Start von Hand heisst der Ref «main»).
      # #206: tauri.cli.conf.json baut die Kommandozeile `vivaplan` und legt sie neben `vivaplan-app` ins Paket.
      # #309/AK10: Mit dem Secret TAURI_SIGNING_PRIVATE_KEY (Einrichtung: docs/ENTWICKLUNG.md, «Updates») erzeugt Tauri
      # zusätzlich die signierten Update-Dateien (.app.tar.gz, -setup.exe, .msi, .AppImage, je mit .sig). Ohne Secret
      # entstehen nur die Pakete, ohne Update-Dateien; ein Release-Lauf (Tag) bricht dann ab.
      - name: npx tauri build
        shell: bash
        working-directory: crates/app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(node -p "require('./tauri.conf.json').version")
          updater=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            updater=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          elif [ -n "$TAG" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY fehlt: ohne signierte Update-Dateien kein Release (#309)"
            exit 1
          else
            echo "::warning::Ohne TAURI_SIGNING_PRIVATE_KEY keine Update-Dateien (#309)"
          fi
          if [ "${{ matrix.name }}" = linux ] && [[ "$version" == *-* ]]; then
            npx tauri build --config tauri.cli.conf.json "${updater[@]}" --bundles deb,appimage
          else
            npx tauri build --config tauri.cli.conf.json "${updater[@]}"
          fi
      # #206/AK1: Die Pakete enthalten die Kommandozeile, und sie läuft (macOS im .app, Linux im .deb, Windows im
      # NSIS-Installer; das .msi wird aus denselben Dateien gebaut).
      - name: Kommandozeile im Paket
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            macos)
              cli=target/release/bundle/macos/VivaPlan.app/Contents/MacOS/vivaplan
              test -x "$cli"
              "$cli" --version ;;
            linux)
              # Tauri schreibt die Pfade im .deb mit oder ohne «./» davor (#261); der Lauf zeigt immer die Zeilen mit
              # usr/bin, auch bei Erfolg, damit die Ursache bei einem Fehler im Protokoll steht.
              dpkg-deb -c target/release/bundle/deb/*.deb > "$RUNNER_TEMP/deb-inhalt.txt"
              grep 'usr/bin' "$RUNNER_TEMP/deb-inhalt.txt" >&2 || true
              grep -E '(^|[ /])usr/bin/vivaplan$' "$RUNNER_TEMP/deb-inhalt.txt" || { echo "usr/bin/vivaplan fehlt im .deb" >&2; exit 1; }
              target/release/vivaplan --version ;;
            windows)
              7z l target/release/bundle/nsis/*.exe | grep -i 'vivaplan\.exe'
              target/release/vivaplan.exe --version ;;
          esac | tee -a "$GITHUB_STEP_SUMMARY"
      # #213/AK1: Ein-Klick-Paket für Claude Desktop (.mcpb, nur macOS) mit der Kommandozeile aus dem .app; die Prüfung
      # packt es aus, prüft das Manifest und startet `vivaplan mcp` wie Claude Desktop.
      - name: Ein-Klick-Paket für Claude Desktop
        if: matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mcpb=$(python3 tools/mcpb.py build --binary target/release/bundle/macos/VivaPlan.app/Contents/MacOS/vivaplan \
            --out target/release/bundle/mcpb)
          python3 tools/mcpb.py check "$mcpb" | tee -a "$GITHUB_STEP_SUMMARY"
      # #141: Rauchtest vor dem Release-Entwurf: Die gebaute App öffnet Fenster und Webansicht, rechnet die
      # Beispielplanung und beendet sich (Code 0 = in Ordnung). Unter Linux in einer virtuellen Anzeige (xvfb);
      # unter Windows hat die App keine Konsole, die Meldung steht deshalb in VIVAPLAN_SMOKE_OUT.
      - name: Rauchtest der App
        shell: bash
        env:
          VIVAPLAN_SMOKE_OUT: ${{ runner.temp }}/rauchtest.txt
        run: |
          case "${{ matrix.name }}" in
            linux)   sudo apt-get install -y xvfb >/dev/null && xvfb-run -a ./target/release/vivaplan-app --smoke ;;
            windows) ./target/release/vivaplan-app.exe --smoke ;;
            macos)   ./target/release/vivaplan-app --smoke ;;
          esac
          status=$?
          cat "$VIVAPLAN_SMOKE_OUT" 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || echo "keine Meldung der App" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: vivaplan-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/release/bundle/mcpb/*.mcpb
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/**/*.sig

  release:
    # job-level `if` kennt `env` nicht: dieselbe Bedingung wie TAG
    if: github.event_name == 'push' || inputs.tag != ''
    needs: pakete
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # #188: Englisch offen, Deutsch, Französisch und Italienisch aufklappbar (tools/changelog.py notes)
      # #188: Titel sprachneutral aus der Version (v1.0.0-beta.2 → «VivaPlan 1.0.0 Beta 2»)
      - name: Release Notes und Titel
        id: notes
        run: |
          python3 tools/changelog.py notes "$TAG" -o "$RUNNER_TEMP/release-notes.md"
          echo "title=$(python3 tools/changelog.py title "$TAG")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: pakete
          merge-multiple: true
      - name: Pakete in einen Ordner legen
        run: |
          mkdir flach
          find pakete -type f -exec mv {} flach/ \;
          ls -l flach
      # #309/AK10: Manifest latest.json für die Update-Suche der App (Version, Änderungen in vier Sprachen, je Plattform
      # Download-Adresse und Signatur). Die App liest es unter releases/latest/download/latest.json, also erst, wenn
      # der Release veröffentlicht ist (nicht Entwurf, nicht Vorabversion).
      # Von Hand mit nur einem Teil der Plattformen entsteht kein Manifest (das bestehende bleibt im Release).
      - name: Update-Manifest
        run: |
          if python3 tools/update_manifest.py flach --tag "$TAG" --repo "$GITHUB_REPOSITORY" --complete -o "$RUNNER_TEMP/latest.json"; then
            mv "$RUNNER_TEMP/latest.json" flach/latest.json
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            exit 1
          else
            echo "::warning::kein latest.json: nicht alle Plattformen gebaut (#309)"
          fi
      # Tag-Push: neuer Entwurf mit allen Paketen
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          draft: true
          name: ${{ steps.notes.outputs.title }}
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: flach/*
      # #203: von Hand mit «tag»: Pakete in den bestehenden Release (auch Entwurf) dieses Tags legen; gleichnamige
      # Dateien werden ersetzt. Gibt es noch keinen Release, entsteht ein Entwurf mit Titel und Release Notes.
      - name: Pakete in den Release des Tags legen
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber flach/*
