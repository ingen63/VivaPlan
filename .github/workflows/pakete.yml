# Baut die Installationspakete: Windows (.msi, .exe), Linux (.deb, .rpm, .AppImage) und macOS (.dmg).
# Start von Hand (Actions → «Installationspakete» → Run workflow) oder durch ein Versions-Tag (v0.3.0):
# dann entsteht zusätzlich ein Entwurf unter «Releases» mit allen Paketen.
name: Installationspakete

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: "nextest" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run --workspace

  pakete:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: linux
            os: ubuntu-22.04
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux-Abhängigkeiten
        if: matrix.name == 'linux'
        uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/app/package-lock.json
      - run: npm ci
        working-directory: crates/app
      - run: npx tauri build
        working-directory: crates/app
      - uses: actions/upload-artifact@v4
        with:
          name: vivaplan-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pakete
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pakete
          merge-multiple: true
      - name: Pakete in einen Ordner legen
        run: |
          mkdir flach
          find pakete -type f -exec mv {} flach/ \;
          ls -l flach
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: flach/*
