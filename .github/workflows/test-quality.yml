name: Test quality
on:
  push:                           # #39: Arbeit direkt auf main, der Push ist die Prüfstelle (statt Pull Request)
    branches: [main]
  pull_request:
  schedule:
    # #159: nicht zur vollen oder halben Stunde (dort ist GitHub am stärksten ausgelastet). `schedule` kann trotzdem
    # Stunden zu spät kommen oder ausfallen; dann von Hand mit `nightly` starten (docs/TESTS.md).
    # #202: Zwei Zeitpläne. Die Jobs unterscheiden sie an `github.event.schedule`: Der wöchentliche Lauf startet nur
    # `mutants-diff` (und `changes`), der nächtliche alle übrigen nächtlichen Jobs. Am Sonntag laufen beide nebeneinander.
    - cron: "17 2 * * *"          # nächtlich 02:17 UTC
    - cron: "17 2 * * 0"          # wöchentlich, Sonntag 02:17 UTC: nur mutants-diff (#202)
  workflow_dispatch:              # manuell: läuft immer
    inputs:
      nightly:
        description: "Alle nächtlichen Jobs ausführen, auch fuzz und den wöchentlichen mutants-diff (#159, #202)"
        type: boolean
        required: false
        default: false
      base:
        description: "Basis für die Abdeckung des geänderten Codes und den Golden-Vergleich #195 (Commit, Tag oder Zweig; leer = Vorgänger HEAD~1)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read                   # für gh run list im changes-Job
  issues: read                    # Übersichtsseite Testqualität liest die Issues (#42)
  pull-requests: read

# #159: Nächtliche Läufe (auch von Hand mit `nightly`) haben eine eigene Gruppe und werden nicht abgebrochen; ein Push
# bricht weiterhin nur den vorherigen Push-Lauf (oder einfachen Start von Hand) ab. #202: Der wöchentliche Lauf hat eine
# eigene Gruppe, damit er am Sonntag nicht auf den nächtlichen wartet.
concurrency:
  group: test-quality-${{ github.ref }}-${{ github.event.schedule == '17 2 * * 0' && 'weekly' || ((github.event_name == 'schedule' || inputs.nightly) && 'nightly' || 'push') }}
  cancel-in-progress: ${{ !(github.event_name == 'schedule' || inputs.nightly) }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      last: ${{ steps.check.outputs.last }}
      rust: ${{ steps.rust.outputs.rust }}
    steps:
      # #225: Hat der Push Rust-Code, Cargo.toml/Cargo.lock oder diesen Workflow geändert? Nur dann laufen die Rust-Tests
      # unter Windows auch beim Push (Job tests-os). Unbekannter Stand vor dem Push (erster Push, Force-Push): ja.
      - id: rust
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" != "push" ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --paginate -q '.files[].filename'); then
            echo "rust=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '\.rs$|(^|/)Cargo\.(toml|lock)$|^\.github/workflows/test-quality\.yml$'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "Kein Rust-Code, keine Cargo-Datei und kein Workflow geändert: Windows-Tests übersprungen (#225)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.nightly }}" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # #202: Nächtliche und wöchentliche Läufe kommen beide von `schedule`; `gh run list` zeigt den Zeitplan nicht.
          # Ein Lauf zählt deshalb als nächtlich, wenn sein Job `fuzz` bestanden hat, und als wöchentlich, wenn alle
          # Teile von `mutants-diff` bestanden haben (Basis für mutants-diff, auch von Hand mit `nightly`).
          last_with() {
            for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow test-quality.yml --event schedule \
                          --status success --limit 30 --json databaseId -q '.[].databaseId'); do
              if gh run view "$id" -R "$GITHUB_REPOSITORY" --json jobs \
                   -q "[.jobs[] | select(.name | startswith(\"$1\"))] | length > 0 and all(.conclusion == \"success\")" | grep -q true; then
                gh run view "$id" -R "$GITHUB_REPOSITORY" --json headSha -q .headSha; return
              fi
            done
          }
          weekly=$(last_with mutants-diff)
          echo "last=$weekly" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.schedule }}" = "17 2 * * 0" ]; then last="$weekly"; else last=$(last_with fuzz); fi
          # #159: Von Hand mit `nightly` läuft immer (Basis für mutants-diff wie wöchentlich).
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "Kein neuer Commit seit letztem Lauf ($last) – übersprungen." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # #56: Der ganze Rust-Code ist mit rustfmt formatiert (rustfmt.toml); Abweichungen lassen den Lauf fehlschlagen.
  format:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - name: cargo fmt --all --check (Workspace)
        run: cargo fmt --all --check
      - name: cargo fmt --all --check (fuzz, eigener Workspace)
        working-directory: fuzz
        run: cargo fmt --all --check

  # #157: Netzwerkfreiheit. cargo tree (ohne Entwicklungsabhängigkeiten, alle Desktop-Ziele) darf keine Bibliothek aus der
  # Sperrliste in tools/check-network-free.sh enthalten; ein Treffer lässt den Lauf fehlschlagen.
  network-free:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests des Prüfskripts (#157/AK1)
        run: python3 -m unittest discover -s tools -p 'test_check_network_free.py'
      - name: Keine Netzwerk-Bibliothek in den Abhängigkeiten
        run: ./tools/check-network-free.sh

  # #165: Code intern englisch. Die Tests des Prüfskripts laufen immer; die Prüfung selbst (--gate) erst, wenn die
  # Übergangsliste in tools/check_english.py leer ist.
  english:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tests des Prüfskripts (#165/AK5)
        run: python3 -m unittest discover -s tools -p 'test_check_english.py'
      - name: Keine deutschen Kommentare und Testnamen
        run: ./tools/check-english.sh --gate
      - name: Tests der Texttabellen-Prüfung (#170/AK1)
        run: python3 -m unittest discover -s tools -p 'test_check_ui_texts.py'
      - name: Keine deutschen Oberflächentexte ausserhalb der Texttabelle (#170/AK1)
        run: python3 tools/check_ui_texts.py
      - name: Tests der Übersetzungsprüfung (#180/AK8)
        run: python3 -m unittest discover -s tools -p 'test_check_i18n.py'
      - name: Übersetzungen gegen das Deutsche, mit Längenhinweisen (#180)
        run: python3 tools/check_i18n.py --hints
      - name: Tests der Prüfung der Release Notes (#188)
        run: python3 -m unittest discover -s tools -p 'test_changelog.py'
      - name: Release Notes in vier Sprachen gegen CHANGELOG.md (#188)
        run: python3 tools/changelog.py check
      - name: Tests des Werkzeugs für die Steuerdatei (#63)
        run: python3 -I -m unittest discover -s tools/steuerdaten

  # #195: GOLDEN_UPDATE=1 macht golden_masters grün, auch wenn die Ausgabe falsch ist. Deshalb vergleicht dieser Job die
  # Golden-Dateien mit dem Stand vor dem Push (Zahlen, Schlüssel, Listenlängen, Monate; Texte nicht) und nennt geänderte
  # Zahlen mit Pfad in der Zusammenfassung. Geänderte Zahlen lassen den Lauf fehlschlagen, ausser einer der gepushten
  # Commits enthält eine Zeile `Golden: #Nr Begründung` (Regel in #195, docs/TESTS.md).
  golden:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }      # Stand vor dem Push und die Commit-Nachrichten seither
      - name: Tests des Prüfskripts (#176/AK2, #195/AK4)
        run: python3 -m unittest discover -s tools -p 'test_golden_numbers.py'
      - name: Golden-Zahlen gegenüber dem Stand vor dem Push (#195)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          # Push: Stand vor dem Push; Pull Request: Basis-Zweig; von Hand: Eingabe, sonst Vorgänger HEAD~1
          case "$EVENT" in
            push)         base="$BEFORE" ;;
            pull_request) base="origin/$BASE_REF" ;;
            *)            base="${INPUT_BASE:-HEAD~1}" ;;
          esac
          # Erster Push eines Zweigs (lauter Nullen) oder unbekannter Stand: Vorgänger des letzten Commits
          if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then base="HEAD~1"; fi
          status=0
          python3 tools/golden_numbers.py --base "$base" --gate > golden.log || status=$?
          cat golden.log
          { echo "### Golden-Zahlen gegenüber $base (#195)"; echo '```'; cat golden.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # #88: clippy bei jedem Push; jede Warnung lässt den Lauf fehlschlagen. Braucht die Linux-Pakete der Desktop-App.
  clippy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04      # wie tests-coverage (Tauri-Abhängigkeiten)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (Workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy (fuzz, eigener Workspace)
        working-directory: fuzz
        run: cargo clippy --all-targets -- -D warnings

  # #87: Unit-Tests der reinen Hilfsfunktionen der Oberfläche (crates/app/ui/util.js) mit node --test, ohne Browser.
  ui-unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # #147: Testabhängigkeiten (fake-indexeddb für runs.test.js); Browser werden hier nicht gebraucht.
      - name: Abhängigkeiten der Unit-Tests
        working-directory: e2e
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
        run: npm ci
      - name: node --test
        run: node --test e2e/unit/*.test.js

  # Einziger Lauf der Rust-Tests mit Abdeckung je Push (#80; vorher zusätzlich coverage.yml).
  # Harte Sperre: Liegt Engine oder App unter tools/coverage-min, schlägt der Schritt fehl.
  # Tests laufen mit nextest wie in make test und im pre-push-Hook: jeder Test in einem eigenen Prozess.
  # Unter cargo test teilen sich parallele Tests den prozessweiten Fortschritt und Abbruch (crates/engine/src/progress.rs).
  tests-coverage:
    needs: changes
    # #202: nicht im wöchentlichen Lauf (nur mutants-diff)
    if: needs.changes.outputs.run == 'true' && github.event.schedule != '17 2 * * 0'
    runs-on: ubuntu-22.04      # wie pakete.yml; ubuntu-latest ist inzwischen 26.04
    timeout-minutes: 90
    env:
      PROPTEST_CASES: ${{ (github.event_name == 'schedule' || inputs.nightly) && '10000' || '256' }}
      VIVAPLAN_UNIX_REQUIRED: "1"   # #224: Linux hat Dateirechte und symbolische Links, die Tests dürfen nicht überspringen
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }      # für die Abdeckung des geänderten Codes (git diff gegen den Basis-Zweig)
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-llvm-cov,nextest" }
      - name: Tests + Coverage (JUnit via nextest-Profil ci)
        run: |
          cargo llvm-cov nextest --workspace --all-features --profile ci \
            --lcov --output-path lcov.info
          # Schwelle je Paket (tools/coverage-min), nicht über den ganzen Arbeitsbereich
          for pkg in vivaplan-engine vivaplan-app vivaplan-cli; do
            cargo llvm-cov report -p "$pkg" --fail-under-lines "$(cat tools/coverage-min)"
          done
          cargo llvm-cov report --html --output-dir coverage-html
          cargo llvm-cov report --cobertura --output-path cobertura.xml
      - name: JUnit einsammeln
        if: ${{ !cancelled() }}
        run: cp "$(find target -path '*nextest/ci/junit.xml' | head -n1)" junit.xml || true
      - name: Tests der Berichtswerkzeuge (Übersichtsseite, Diff-Abdeckung)
        run: python3 -m unittest discover tools/report
      - name: Basis für den geänderten Code bestimmen
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          # Push: Stand vor dem Push; Pull Request: Basis-Zweig; von Hand: Eingabe; sonst (nächtlich): kein Vergleich
          case "$EVENT" in
            push)              base="$BEFORE" ;;
            pull_request)      base="origin/$BASE_REF" ;;
            workflow_dispatch) base="${INPUT_BASE:-HEAD~1}" ;;
            *)                 base="" ;;
          esac
          # Erster Push eines Zweigs (lauter Nullen) oder unbekannter Stand: Vorgänger des letzten Commits
          if [ -n "$base" ] && ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            base="HEAD~1"
          fi
          echo "DIFF_BASE=$base" >> "$GITHUB_ENV"
      - name: Abdeckung des geänderten Codes (Hinweis, keine Sperre)
        if: ${{ !cancelled() && env.DIFF_BASE != '' }}
        continue-on-error: true
        run: python3 tools/coverage_diff.py lcov.info "$DIFF_BASE" >> "$GITHUB_STEP_SUMMARY"
      # #89: e2e läuft nur nächtlich (Job e2e); die Übersichtsseite zeigt das jüngste vorhandene Ergebnis.
      # Jüngstes noch vorhandenes Ergebnis auf main, egal ob nächtlich oder von Hand mit `nightly` gestartet
      # (`schedule` fällt bei GitHub öfter aus). Fehlt es, bleibt die Übersichtsseite ohne e2e, ohne Fehler.
      - name: Jüngste Oberflächentests holen
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=e2e-results&per_page=20" \
                 -q '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].workflow_run.id // empty')
          if [ -z "$id" ]; then
            echo "Kein e2e-Ergebnis vorhanden – Übersichtsseite ohne Oberflächentests."
            exit 0
          fi
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n e2e-results -D e2e
      - name: Übersichtsseite Testqualität
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/report/report.py --out report-html --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage-Zusammenfassung
        if: ${{ !cancelled() }}
        run: |
          { echo '### Coverage'; echo '```'; cargo llvm-cov report --summary-only; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-quality-reports
          path: |
            lcov.info
            cobertura.xml
            coverage-html/
            junit.xml
            report-html/

  mutants-diff:
    needs: changes
    # Pull Request, sonst wöchentlich (Arbeit direkt auf main, also kein PR; #202) oder von Hand mit `nightly` (#159):
    # Mutanten der seit dem letzten erfolgreichen wöchentlichen Lauf geänderten Zeilen des Rechenkerns.
    if: github.event_name == 'pull_request' || ((github.event.schedule == '17 2 * * 0' || inputs.nightly) && needs.changes.outputs.run == 'true')
    # #202: Nächtlich in 16 Teilen brauchte mutants-diff rund 55 % der Actions-Minuten, vor allem für die Vorbereitung
    # (Abhängigkeiten, Cache, erster Build: über 10 Minuten je Teil). Deshalb wöchentlich (Sonntag, eigener `schedule`)
    # in 4 Teilen und nur für den Rechenkern (`crates/engine`): Basis ist der letzte erfolgreiche wöchentliche Lauf,
    # höchstens 7 Tage zurück. Gemessen am 18.11.2026 (#159): 3 Tage Änderungen im ganzen Workspace ergaben rund 980
    # Mutanten bei rund 75 s je Mutant, mit 4 Teilen rund 2½ Stunden je Teil; eine Woche des ganzen Workspace könnte die
    # 6-Stunden-Grenze eines Jobs überschreiten, daher nur der Rechenkern. App und Kommandozeile prüft der volle Lauf von
    # Hand (`mutation-full.yml`, `make mutants`). Ein Pull Request mutiert wie bisher alle geänderten Rust-Zeilen.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04      # cargo-mutants braucht glibc 2.39 (22.04 hat 2.35)
    timeout-minutes: 360       # #202: Höchstwert eines Jobs bei GitHub
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-mutants,nextest" }
      - name: Mutanten auf geänderten Zeilen
        env:
          # #159: rust-cache und rust-toolchain setzen CARGO_INCREMENTAL=0 (für den Cache); ein Mutant ändert nur eine
          # Stelle, inkrementell übersetzt sollte sein Build kürzer sein (nächster Lauf zeigt es). Gilt nur für diesen Schritt.
          CARGO_INCREMENTAL: "1"
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          LAST: ${{ needs.changes.outputs.last }}
        run: |
          # Pull Request: Basis-Zweig, alle Rust-Dateien. Wöchentlich und von Hand mit `nightly` (#202): letzter
          # erfolgreicher wöchentlicher Lauf, sonst der letzte Commit vor 7 Tagen, sonst der Vorgänger von HEAD;
          # nur der Rechenkern.
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$BASE_REF"
            paths='*.rs'
          else
            base="$LAST"
            git rev-parse --verify --quiet "${base:-x}^{commit}" >/dev/null || base=$(git rev-list -n1 --before="7 days ago" HEAD)
            # #202: höchstens 7 Tage zurück, damit der Lauf im Zeitlimit bleibt
            limit=$(git rev-list -n1 --before="7 days ago" HEAD)
            if [ -n "$base" ] && [ -n "$limit" ] && git merge-base --is-ancestor "$base" "$limit"; then
              echo "Basis $base liegt mehr als 7 Tage zurück; begrenzt auf $limit." >> "$GITHUB_STEP_SUMMARY"
              base="$limit"
            fi
            [ -n "$base" ] || base="HEAD~1"
            paths='crates/engine/*.rs'
          fi
          echo "Basis für den Vergleich: $base, Dateien \`$paths\` (Teil ${{ matrix.shard }} von 4)" >> "$GITHUB_STEP_SUMMARY"
          # Nur Rust-Dateien: cargo mutants kann den Kopf einer umbenannten Markdown-Datei mit Umlaut nicht lesen
          # (git setzt den Pfad in Anführungszeichen mit Oktalcodes).
          git diff "$base"...HEAD -- "$paths" > pr.diff
          if ! grep -q '\.rs$' <(git diff --name-only "$base"...HEAD -- "$paths"); then
            echo "Keine Rust-Änderungen – keine Mutanten." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          status=0
          cargo mutants --in-diff pr.diff --no-shuffle -j 2 --shard ${{ matrix.shard }}/4 || status=$?
          # #159: Ein Timeout zählt als erkannt (docs/TESTS.md, Endlosschleife). cargo mutants endet bei Timeouts mit
          # Code 3, auch wenn es zusätzlich nicht erkannte Mutanten gibt (dann ebenfalls 3, sonst 2). Massgebend ist
          # deshalb die Zahl der nicht erkannten Mutanten; andere Codes (z. B. 4, Basislauf rot) bleiben Fehler.
          if [ "$status" = 2 ] || [ "$status" = 3 ]; then
            missed=$(jq '.missed' local/mutants.out/outcomes.json)
            [ "$missed" = 0 ] && exit 0
            exit 2
          fi
          exit "$status"
      - name: Mutations-Zusammenfassung
        if: ${{ !cancelled() }}
        run: |
          f=local/mutants.out/outcomes.json
          [ -f "$f" ] || exit 0
          jq -r '"### Mutation testing (Teil ${{ matrix.shard }} von 4)\ncaught: \(.caught)  missed: \(.missed)  timeout: \(.timeout)  unviable: \(.unviable)"' "$f" >> "$GITHUB_STEP_SUMMARY"
          if [ -s local/mutants.out/missed.txt ]; then
            echo '#### Nicht erkannte Mutanten' >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/- /' local/mutants.out/missed.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: 'mutants-diff-${{ matrix.shard }}', path: local/mutants.out/ }

  # #89: Oberflächentests (e2e/, Playwright) nächtlich und von Hand; nur bei neuem Commit wie die übrigen nächtlichen Jobs.
  # Dauer 20 bis 30 Minuten auf dem 2-Kern-Runner. Der Entwicklungsserver (vivaplan ui-dev) startet die Playwright-Konfiguration selbst.
  e2e:
    needs: changes
    if: needs.changes.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event.schedule != '17 2 * * 0'
    runs-on: ubuntu-24.04      # hat Google Chrome (die Konfiguration nutzt channel: chrome)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Abhängigkeiten der Oberflächentests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chrome
      - name: Playwright
        working-directory: e2e
        run: npx playwright test
      # Ergebnis immer ablegen: Die Übersichtsseite (tests-coverage) liest e2e/results.json des letzten Laufs.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: e2e-results, path: e2e/results.json, retention-days: 30 }
      # Bei Fehlschlag Bericht und Traces (trace: retain-on-failure) zum Nachsehen.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: |
            e2e/playwright-report/
            e2e/test-results/

  # #141: Die Rust-Tests laufen bei jedem Push unter Linux (tests-coverage). Nächtlich zusätzlich unter Windows und macOS:
  # Pfade (Laufwerk, Backslash), Mathematikbibliotheken der Plattform (Golden Masters mit der heutigen Toleranz) und
  # das Übersetzen der Desktop-App. Die Runner von GitHub sind für das öffentliche Repo kostenlos (Kommentar in #141).
  # #225: Windows zusätzlich bei jedem Push auf main, wenn Rust-Code, Cargo.toml/Cargo.lock oder dieser Workflow geändert
  # wurden (Ausgabe `rust` des Jobs changes); ohne Abdeckung und ohne Mutationstests. macOS bleibt nächtlich.
  # Budget 300 Actions-Minuten pro Woche (Schätzung im Issue): darüber nur vivaplan-engine und die Pfadtests der App.
  tests-os:
    needs: changes
    if: >-
      needs.changes.outputs.run == 'true' && (
        ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event.schedule != '17 2 * * 0') ||
        (github.event_name == 'push' && needs.changes.outputs.rust == 'true'))
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["windows-latest"]') || fromJSON('["windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # #224: Der Runner stellt die Plattform bereit; deren Tests schlagen fehl statt still zu überspringen (docs/TESTS.md).
    env:
      VIVAPLAN_WINDOWS_REQUIRED: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      VIVAPLAN_UNIX_REQUIRED: ${{ matrix.os == 'macos-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: nextest }
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests-${{ matrix.os }}
      - name: cargo nextest run --workspace (${{ matrix.os }})
        shell: bash
        run: |
          cargo nextest run --workspace --no-fail-fast 2>&1 | tee tests-os.log
          status=${PIPESTATUS[0]}
          {
            echo "### Rust-Tests unter ${{ matrix.os }} (#141)"
            if [ "$status" = 0 ]; then echo "Alle bestanden."; else echo "**Fehlgeschlagen:**"; grep -E '^ +FAIL' tests-os.log | sed 's/^/    /'; fi
            grep -E 'Summary' tests-os.log | tail -1 | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # #146: Ausgeliefert wird das Profil «release» (thin LTO, codegen-units 1, ohne Überlaufprüfung). Die übrigen Tests laufen
  # im Testprofil; nächtlich prüfen Golden Masters und Referenztabelle, dass der ausgelieferte Build dieselben Ergebnisse
  # liefert (heutige Toleranz, ohne GOLDEN_UPDATE). Nur der Rechenkern: keine Tauri-Abhängigkeiten nötig.
  release-golden:
    needs: changes
    if: needs.changes.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event.schedule != '17 2 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: nextest }
      - uses: Swatinem/rust-cache@v2
        with: { key: release-golden }
      - name: Golden Masters und Referenztabelle im Release-Profil
        run: |
          unset GOLDEN_UPDATE
          cargo nextest run --cargo-profile release -p vivaplan-engine -E 'test(/^golden::|^ods_reference::/)' \
            --no-fail-fast 2>&1 | tee release-golden.log
          status=${PIPESTATUS[0]}
          {
            echo "### Golden Masters im Release-Profil (#146)"
            if [ "$status" = 0 ]; then echo "Alle bestanden."; else echo "**Fehlgeschlagen** – Ausgabe im Log des Jobs."; fi
            grep -E '^ +(PASS|FAIL)|Summary' release-golden.log | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # #139: Speicher an der Grenze von 50 Mio. Pfad-Monaten und Stresstest (Ehepaar, 4 Liegenschaften, 100 Jahre,
      # 40'000 Pfade). Beide sind im Testprofil zu langsam für jeden Push (#[ignore]), im Release-Profil Sekunden.
      - name: Speichergrenze und Stresstest im Release-Profil
        run: |
          cargo nextest run --cargo-profile release -p vivaplan-engine --run-ignored only --no-capture \
            -E 'test(/issue_139_ak4_peak_memory|stress_couple_four_properties_100_years/)'

  fuzz:
    needs: changes
    # #159: auch von Hand mit `nightly`
    if: (github.event_name == 'schedule' || inputs.nightly) && github.event.schedule != '17 2 * * 0' && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-fuzz }
      # #86: Der Korpus wächst von Nacht zu Nacht. Gespeichert wird je Lauf ein neuer Stand; geladen der jüngste.
      - name: Korpus aus dem letzten Lauf
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Alle Fuzz-Targets je 5 Minuten
        run: |
          # #46: cargo-fuzz baut ohne --target für das Ziel, für das es selbst gebaut ist.
          # install-action lädt die musl-Fassung, und musl verträgt den AddressSanitizer nicht.
          # Deshalb ausdrücklich für den Host bauen (x86_64-unknown-linux-gnu).
          host=$(rustc +nightly -vV | sed -n 's/^host: //p')
          cd fuzz
          # #86: Neue Eingaben landen in corpus/<Ziel> (Cache); seeds/<Ziel> ist der Startkorpus im Repo.
          # Ein Fund (Absturz, Panik) beendet den Lauf mit Fehler; die Eingabe liegt dann unter artifacts/.
          for t in $(cargo +nightly fuzz list); do
            mkdir -p "corpus/$t"
            seeds=""; [ -d "seeds/$t" ] && seeds="seeds/$t"
            cargo +nightly fuzz run --target "$host" "$t" "corpus/$t" $seeds -- -max_total_time=300
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: fuzz-artifacts, path: fuzz/artifacts/ }
