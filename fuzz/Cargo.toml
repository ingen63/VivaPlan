[package]
name = "vivaplan-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vivaplan-engine = { path = "../crates/engine" }
serde_json = "1"

[workspace]

[[bin]]
name = "parse_csv"
path = "fuzz_targets/parse_csv.rs"
test = false
doc = false

[[bin]]
name = "parse_snb"
path = "fuzz_targets/parse_snb.rs"
test = false
doc = false

[[bin]]
name = "validate_plan"
path = "fuzz_targets/validate_plan.rs"
test = false
doc = false

[[bin]]
name = "run_plan"
path = "fuzz_targets/run_plan.rs"
test = false
doc = false
