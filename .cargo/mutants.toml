# #106: Kommandozeile (ohne main.rs, reine Verdrahtung) und App sind im Lauf; die CLI-main.rs verteilt nur Befehle
# #116: test_alloc.rs ist die Speichergrenze der Testprogramme (Testinfrastruktur, nicht Teil der App). Ein Mutant darin
# veränderte den Speicherverwalter aller Tests und sagte nichts über die Tests der App aus.
exclude_globs = ["crates/cli/src/main.rs", "crates/engine/src/test_alloc.rs"]
test_tool = "nextest"

# #40: Begründet ausgeschlossene Mutanten. Zwei Arten:
#  - gleichwertig: Das Ergebnis bleibt bei jeder Eingabe gleich (redundante Bedingung, Betrag 0, nie gelesener Wert).
#  - Grenzfall: Der Mutant ändert nur das Verhalten bei exakter Gleichheit zweier gerechneter Frankenbeträge oder
#    innerhalb der Rundungstoleranz von 0.005; fachlich ist das ohne Bedeutung, ein Test dafür prüfte Rundungszufälle.
# Jeder Eintrag nennt Datei, Spalte und Funktion; die Zeile ist offen (\d+), damit Änderungen oberhalb den Eintrag nicht
# lösen. Verschiebt sich der Ausdruck innerhalb der Zeile, erscheint der Mutant wieder als nicht erkannt und wird neu
# beurteilt. Offene (noch nicht getestete) Mutanten stehen in docs/TESTS.md. Begründungen:
exclude_re = [
    # Bei x = 0 ist die Steuer in beiden Fällen 0.
    "replace < with <= in tax",
    # Mit head × 1 wird zusätzlich die Kopfzeile gelesen; ihre erste Zelle ist kein Datum und wird übersprungen.
    "import\\.rs:\\d+:25: replace \\+ with \\* in parse_shiller",
    # Grenzwert |y1| = 1e-9: Die Formel und der Grenzwert n unterscheiden sich dort um weniger als die Rechengenauigkeit.
    "import\\.rs:\\d+:31: replace < with <= in bond_return",
    # Grenzwert |r| = 1e-9 bei der VPW-Rate: gleiches Ergebnis innerhalb der Rechengenauigkeit.
    "sim\\.rs:\\d+:27: replace < with <= in vpw_rate",
    # Historischer Pfad: Ein Monat bzw. Jahre mehr Fortschreibung als nötig; die zusätzlichen Werte werden nie gelesen.
    "market\\.rs:\\d+:48: replace - with [+/] in historical_path",
    "market\\.rs:\\d+:51: replace - with \\+ in historical_path",
    # Zufallszahlen: Die Grenzen q = 0, q = 1 (Polar-Methode), w = 1 (Student-t nach Bailey, #132) und p = l (Poisson)
    # treten mit Wahrscheinlichkeit 0 auf.
    "montecarlo\\.rs:\\d+:18: replace > with >= in Rng::normal",
    "montecarlo\\.rs:\\d+:29: replace < with <= in Rng::normal",
    "montecarlo\\.rs:\\d+:18: replace < with <= in Rng::student_t",
    "montecarlo\\.rs:\\d+:17: replace > with >= in Rng::poisson",
    # #132, Sprünge: Die Bedingung pk > 0 schützt nur davor, dass die Summe nach dem Unterlauf von pk unter u stehen
    # bliebe; vorher erreicht die Summe bei jedem λ der Planung u (gleichwertig bis auf Wahrscheinlichkeit 0).
    "montecarlo\\.rs:\\d+:30: replace > with >= in Jumps::today",
    # Block-Bootstrap: Grenze u = p_new mit Wahrscheinlichkeit 0.
    "montecarlo\\.rs:\\d+:38: replace < with <= in Bootstrap<'_>::positions",
    # Jahres-Bootstrap: Positionen für mehr Jahre als nötig; die Zufallszahlen danach werden nicht mehr verwendet.
    "montecarlo\\.rs:\\d+:62: replace - with [+/] in Bootstrap<'_>::path",
    "montecarlo\\.rs:\\d+:41: replace - with \\+ in Bootstrap<'_>::path",
    # Ziel 2 ohne geplante Ausgaben: median / 0 ergibt ±∞ oder NaN, max(0) macht daraus in beiden Fällen 0.
    "optimize\\.rs:\\d+:41: replace > with >= in Metrics::violation",
    # Schwankung: Ausgangswerte von genau 1e-9 kommen nicht vor (Jahreskonsum ist 0 oder mindestens Rappenbeträge).
    "optimize\\.rs:\\d+:26: replace > with >= in path_stats",
    # Mustersuche: Die Schrittweite 0.2 / 2^k ist nie genau 0.01.
    "optimize\\.rs:\\d+:16: replace > with >= in search",

    # --- Simulation (sim.rs), gleichwertig ---
    # Folgekauf und Käufe «nach Verkauf»: «attempted» deckt «active» und «done» ab (gekauft oder entfallen heisst immer
    # versucht); die verkaufte Immobilie ist erledigt. Die Teilbedingungen sind redundant.
    "sim\\.rs:\\d+:26: replace \\|\\| with && in Run<'a>::follow_up_purchase",
    "sim\\.rs:\\d+:37: replace \\|\\| with && in Run<'a>::follow_up_purchase",
    "sim\\.rs:\\d+:26: replace \\|\\| with && in Run<'a>::after_sales",
    "sim\\.rs:\\d+:37: replace \\|\\| with && in Run<'a>::after_sales",
    # Kauf «nach Verkauf» entfällt: Ohne Immobilie im Besitz ist der Monat nach dem Verkauf schon vorgemerkt; mit einer
    # Immobilie im Besitz setzt die anschliessende Prüfung im selben Monat die Vormerkung zurück (ohne Folgen).
    # Ausnahme von der offenen Zeile: Spalte und Funktion treffen auch andere Bedingungen in after_sales; verschiebt sich
    # die Zeile, erscheint der Mutant wieder und der Eintrag wird nachgeführt.
    "sim\\.rs:1351:20: delete ! in Run<'a>::after_sales",
    # Amortisation 0: Es kommen 0 Franken dazu (Schätzung, laufende Kosten, Quartalszahlung).
    "sim\\.rs:\\d+:34: replace > with >= in Run<'a>::running_estimate",
    "sim\\.rs:\\d+:34: replace > with >= in Run<'a>::properties",
    # Verschiebungen von höchstens 1e-9 werden nicht gebucht: Überschuss genau gleich Ziel bucht nichts.
    "sim\\.rs:\\d+:33: replace > with >= in Run<'a>::fill_pots",
    "sim\\.rs:\\d+:34: replace > with >= in Run<'a>::fill_pots",
    # Vermögen genau gleich Reserve: Beide Zweige ergeben Bargeld = Vermögen, Anlagen 0.
    "sim\\.rs:\\d+:28: replace < with <= in Run<'a>::rebalance",
    # Bedarf: Der Monat m liegt nie nach dem Planende, es zählt immer mindestens ein Monat (n > 0).
    "sim\\.rs:\\d+:22: replace > with >= in Run<'a>::plan_basis",
    # Aktienrendite: Die Renditen des Monats sind beim Aufruf schon verbucht (k < Länge); die Begrenzung greift nie.
    "sim\\.rs:\\d+:49: replace - with [+/] in Run<'a>::stock_return",
    # Start im Januar (k = 0): Teuerungsfaktor 1, die AHV bleibt gleich.
    "sim\\.rs:\\d+:36: replace > with >= in Run<'a>::execute",
    # Einmalbetrag 0: zählt als Ausgabe 0.
    "sim\\.rs:\\d+:32: replace < with <= in Run<'a>::execute",
    # Reservierung von 0 (Verkauf ohne Erlös): wirkt nur auf das Protokoll der Töpfe (Eintrag über 0), nicht auf die
    # Beträge. Ein Verkauf ohne Erlös reserviert ohnehin nichts (net > 0 vorausgesetzt).
    "sim\\.rs:\\d+:19: replace > with >= in Run<'a>::mark_reservation",
    # C2 und Notverkauf, während ein Verkaufserlös reserviert ist: Die Reservierung besteht nur im Verkaufsmonat; dass
    # die Töpfe im selben Monat nicht reichen und noch eine Immobilie im Besitz ist, setzt eine zweite Immobilie und
    # einen Verkauf mit Folgekauf im selben Monat voraus. Bewusst nicht getestet (Entscheid zu #40).
    "sim\\.rs:\\d+:43: replace - with \\+ in Run<'a>::cover_payments",
    "sim\\.rs:\\d+:34: replace > with (==|>=|<) in Run<'a>::cover_payments",
    # PK-Kapitalbezug: Die Steuer t liegt zwischen 0 und dem Bezug, lump − t > 0 gilt genau dann, wenn lump + t > 0 bzw.
    # lump / t > 0.
    "sim\\.rs:\\d+:29: replace - with [+/] in Run<'a>::execute",

    # --- Simulation (sim.rs), Grenzfälle ---
    # Tragbarkeit bei der Erneuerung: Vermögen nach der Einmalzahlung genau 0 bzw. genau auf dem Notverkaufskriterium.
    "sim\\.rs:\\d+:39: replace < with <= in Run<'a>::renewal_affordability",
    "sim\\.rs:\\d+:60: replace < with <= in Run<'a>::renewal_affordability",
    # Kauf: Vermögen genau gleich den Eigenmitteln.
    "sim\\.rs:\\d+:19: replace < with <= in Run<'a>::try_buy",
    # Phase 8: Topf 1 genau 0 (≤ statt <).
    "sim\\.rs:\\d+:42: replace < with <= in Run<'a>::bucket_step",
    # C1: Rundungstoleranz −0.005 statt +0.005.
    "sim\\.rs:\\d+:49: delete - in Run<'a>::cover_payments",
    # Guardrails: Vermögen genau 0, Rate genau gleich Start- bzw. Grenzrate.
    "sim\\.rs:\\d+:50: replace > with >= in Run<'a>::update_budget",
    "sim\\.rs:\\d+:73: replace > with >= in Run<'a>::update_budget",
    "sim\\.rs:\\d+:25: replace > with >= in Run<'a>::update_budget",
    "sim\\.rs:\\d+:32: replace < with <= in Run<'a>::update_budget",
    # Rendite nur bei positivem Vermögen: Vermögen genau 0.
    "sim\\.rs:\\d+:23: replace > with >= in Run<'a>::execute",
    # Aufgebraucht: Rundungstoleranz 0.005 (≤ statt <).
    "sim\\.rs:\\d+:24: replace < with <= in Run<'a>::execute",
    # --- #124 (voller Lauf vom 16.11.2026), gleichwertig ---
    # Säule 3a: Eine Einzahlung von 0 erhöht das Guthaben um 0.
    "sim\\.rs:\\d+:33: replace > with >= in Run<'a>::pillar3a",
    # Korrelation: Die Abweichungen vom Mittelwert summieren sich zu 0; (x + mx)·(y − my) und (x − mx)·(y + my) ergeben
    # dieselbe Kovarianz.
    "calibrate\\.rs:\\d+:(52|63): replace - with \\+ in corr",
    # Jahresrendite ohne Streuung: Φ(±∞) ist dieselbe Stufe wie der Zweig ohne Streuung; anders nur, wenn die Bisektion genau
    # das Mittel trifft.
    "calibrate\\.rs:\\d+:23: replace > with >= in YearModel::cdf_log",
    # Bisektion: Ob Gleichheit mit p nach unten oder oben geht, verschiebt das Quantil höchstens um eine Rundungsstelle.
    "calibrate\\.rs:\\d+:34: replace < with <= in YearModel::quantile",
    # Streuung der einfachen und der Log-Rendite sind genau dann 0, wenn die Verteilung ein Punkt ist, also immer beide.
    "calibrate\\.rs:\\d+:22: replace \\|\\| with && in YearModel::corr_simple_log",
    # Raster ohne Sprünge: Ohne Abbruch wiederholt die Schleife dieselbe Kombination (Sprunghöhe 0) mit demselben Fehler;
    # die erste bleibt. Zwei Kombinationen mit genau demselben Fehler (≤ statt <) kommen im Raster nicht vor.
    "calibrate\\.rs:\\d+:28: replace > with < in fit_moments",
    "calibrate\\.rs:\\d+:54: replace < with <= in fit_moments",
    # Monats-Bootstrap: Grenze u = 1/12 mit Wahrscheinlichkeit 0.
    "calibrate\\.rs:\\d+:46: replace < with <= in bootstrap_years",
    # Wohnanteil: Die Schutzgrenze von 1000 Perioden wird nie erreicht. Eine Periode, die genau im Startmonat beginnt, ist
    # im Zweig davor erledigt (m > start statt >=); ohne Abbruch (==) findet die Schleife danach keinen Treffer mehr.
    "housing\\.rs:\\d+:54: replace < with <= in start_housing",
    "housing\\.rs:\\d+:30: replace > with (==|>=) in start_housing",
    # JST: BIP mal Bevölkerung ist in den Daten nie genau 0.
    "jst\\.rs:\\d+:49: replace > with >= in JstData::gdp_weight",
    # Ein Eintrag genau bei `from` ist schon als at(from) enthalten.
    "resolve\\.rs:\\d+:57: replace < with <= in Curve::first_above",
    # Welt individuell: Eine Region mit Gewicht 0 trägt 0 bei (alle Regionen haben in allen Jahren Werte).
    "strategy\\.rs:\\d+:56: replace > with >= in custom_world",
    # Jahres-Bootstrap, Vorlauf: (a + n − back + n) % n ist gleich (a + n − back % n) % n, weil back kleiner als n ist.
    "montecarlo\\.rs:\\d+:62: replace % with \\+ in Bootstrap<'_>::path",
    # Import alter Dateien: Fehlende feste Meilensteine hat der Schritt `milestones` vorher eingefügt; der Zweig für
    # «retire» und «ahv» ohne Eintrag wird nie erreicht («false», «&&» und das Alter darin ändern nichts).
    "upgrade\\.rs:\\d+:21: replace match guard .* with false in pillar3a",
    "upgrade\\.rs:\\d+:49: replace \\|\\| with && in pillar3a",
    "upgrade\\.rs:\\d+:62: replace \\* with [+/] in pillar3a",
    # Prüfung: Eine indirekte Amortisation von 0 erhöht das Maximum nicht.
    "validate\\.rs:881:32: replace > with >= in check",

    # --- #124, Grenzfälle ---
    # Säule 3a: Wunschbetrag genau Guthaben + 0.005, Rest genau 0.005 (Rundungstoleranz).
    "sim\\.rs:\\d+:58: replace > with >= in Run<'a>::pillar3a",
    "sim\\.rs:\\d+:25: replace > with >= in Run<'a>::pillar3a",
    # Gewichte der Regionen: Summe genau 1 ± 1e-6.
    "strategy\\.rs:\\d+:24: replace > with >= in weight_issue",
    # Alter genau auf der Grenze ± 1e-9 (Import und Prüfung).
    "upgrade\\.rs:\\d+:30: replace (< with <=|> with >=) in milestones",
    "validate\\.rs:323:(20: replace < with <=|39: replace > with >=) in check",
    # Prüfung: Wohnanteil, Maximalbetrag der 3a mit indirekter Amortisation (Rundungstoleranz 0.005).
    "validate\\.rs:377:26: replace < with <= in check",
    "validate\\.rs:937:40: replace > with >= in check",
    "validate\\.rs:1006:21: replace > with >= in check",
    # #106, App (`crates/app/src/main.rs`): Die folgenden Mutanten betreffen Aufrufe, die erst eine laufende Anwendung mit
    # Fenster, Betriebssystem-Dialog oder Ereignisschleife auslöst. Die Mock-Runtime von Tauri (`tauri::test`) kann sie nicht
    # erzeugen (`request_exit` ist dort nicht umgesetzt, `ExitRequestApi` hat keinen öffentlichen Konstruktor). Die
    # Entscheidungen dahinter (`ask_before_exit`, `Quit::must_ask`, `picked`, `save_with`) sind einzeln getestet.
    # Beenden über das System: `ExitRequestApi` ist nur der Laufzeit zugänglich; die Bedingung steckt in `ask_before_exit`.
    "main\\.rs:\\d+:\\d+: replace match guard ask_before_exit\\(app\\) with (true|false) in on_run_event",
    # Beenden: `app.exit(0)` ist in der Mock-Runtime nicht umgesetzt (`quit_app`); `quit_from_menu` ist getestet.
    "main\\.rs:\\d+:\\d+: replace quit_app with \\(\\)",
    # Fenster-Ereignis: braucht ein echtes Fenster (Schliessen-Knopf); die Rückfrage ist in `ask_before_exit` getestet.
    "main\\.rs:\\d+:\\d+: replace on_window_event with \\(\\)",
    # Dünner Wrapper um `remember_in` (getestet); ein Test über den Datenordner der Mock-App würde sich mit den übrigen
    # Tests (gleiche Datei, parallele Prozesse) stören.
    "main\\.rs:\\d+:\\d+: replace remember_plan with \\(\\)",
    # Betriebssystem-Dateidialoge (`NativeDialogs`): öffnen ein echtes Fenster; die Auswahl ist über `FakeDialogs` getestet.
    "main\\.rs:\\d+:\\d+: replace <impl Dialogs for NativeDialogs<R>>::(pick_file|pick_files|save_file) -> .* with .*",
    # Menü der echten Anwendung: Tauri gibt das Tastenkürzel eines Eintrags nicht zurück; Tabellen und Kürzel sind getestet.
    "main\\.rs:\\d+:\\d+: delete ! in submenu",
    "main\\.rs:\\d+:\\d+: replace install_menu -> .* with .*",
    # Start der echten Anwendung (Fenster aus der Konfiguration, Dialoge, Menü): nur mit laufender Ereignisschleife.
    "main\\.rs:\\d+:\\d+: replace setup_app -> .* with .*",
    "main\\.rs:\\d+:\\d+: replace main with \\(\\)",
    # Rauchtest (#141): `smoke_done` beendet die App mit `app.exit`, das die Mock-Runtime nicht umsetzt (wie `quit_app`).
    # Die Teile sind getestet (`smoke_outcome`, `smoke_report`, ohne `--smoke` ohne Wirkung); den ganzen Ablauf prüft der
    # Rauchtest in `pakete.yml` auf allen drei Systemen.
    "main\\.rs:\\d+:\\d+: replace smoke_done with \\(\\)",
    # Ereignisse der Laufzeit: Ausserhalb von macOS behandelt `on_run_event` nur `ExitRequested` (siehe oben,
    # `ExitRequestApi` ohne öffentlichen Konstruktor); die Entscheidung steckt in `ask_before_exit`.
    "main\\.rs:\\d+:\\d+: replace on_run_event with \\(\\)",

    # --- #162 (mutants-diff vom 18.11.2026), gleichwertig ---
    # Fallende Steuer, Sprung in einer Gruppe gleicher Beträge: Bei k = first vergleicht die Bedingung den Satz der Zeile mit
    # sich selbst (r < r − EPS), das ist immer falsch.
    "tax\\.rs:\\d+:28: replace > with >= in falling_row",
    # Atomares Speichern: Für eine vorhandene gewöhnliche Datei zeigt `canonicalize` auf dieselbe Datei; eine neue Datei
    # (kein Eintrag) erreicht den Zweig nicht.
    "api\\.rs:\\d+:\\d+: replace match guard m\\.file_type\\(\\)\\.is_symlink\\(\\) with true in write_atomic",
    # Speichergrenze: Die Prüfung kommt erst nach «Ende nach Start», es gibt also immer mindestens einen Monat; mit
    # months = 0 wäre das Produkt 0 und die Bedingung ebenfalls falsch.
    "validate\\.rs:215:19: replace > with >= in check",
    # --- #162, Grenzfälle ---
    # Fallende Steuer: Der Satz der letzten Zeile einer Gruppe liegt genau um die Toleranz EPS (1e-12) unter dem der
    # ersten; bei gerechneten Sätzen kommt das nicht vor.
    "tax\\.rs:\\d+:52: replace < with <= in falling_row",
    # Fallende Steuer: Ableitung (Anfang bzw. Ende eines Abschnitts) genau −EPS.
    "tax\\.rs:\\d+:(26|48): replace < with <= in falling_row",
]

# #43: Laufzeit begrenzen. Das Zeitlimit eines Mutanten ist max(Mindestzeit, Dauer des unveränderten Testlaufs × Faktor).
# Der Testlauf mit dem Profil «mutants» dauert wenige Sekunden; mit Mindestzeit 60 s und Faktor 1 gilt faktisch eine feste
# Höchstdauer von 1 Minute (#116: vorher 120 s; eine Endlosschleife belastet den Rechner so nur halb so lange). Ein Timeout zählt als erkannt (Endlosschleife). Mutationsläufe verwenden das nextest-Profil «mutants» (.config/nextest.toml) ohne die schweren Tests.
minimum_test_timeout = 60.0
timeout_multiplier = 1.0
additional_cargo_test_args = ["--profile", "mutants"]

# #43: eigenes Build-Profil (Cargo.toml, [profile.mutants]): ohne Debug-Informationen und mit leichter Optimierung.
# Begründung und Messung stehen dort und in docs/TESTS.md.
profile = "mutants"

# #48: Ergebnisse nach local/mutants.out statt ins Wurzelverzeichnis (local/ ist von Git ausgeschlossen).
output = "local"
