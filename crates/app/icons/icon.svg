<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- VivaPlan app icon «Gipfelweg – Abendrot» (#185): two mountain ranges in front of a low sun,
       a dotted path up the front slope. Tile 104 units on the macOS grid (824 px, 100 px margin). -->
  <defs>
    <clipPath id="tile"><rect width="104" height="104" rx="23"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g transform="translate(100 100) scale(7.923)">
    <rect width="104" height="104" rx="23" fill="#f28c38" filter="url(#shadow)"/>
    <g clip-path="url(#tile)">
      <rect width="104" height="104" fill="#f28c38"/>
      <circle cx="54" cy="46" r="20" fill="#ffd27a"/>
      <polygon points="0,74 22,52 38,64 58,40 78,60 104,46 104,104 0,104" fill="#c0502a"/>
      <polygon points="0,90 30,68 52,82 74,64 104,86 104,104 0,104" fill="#6b2a2a"/>
      <polyline points="28,104 36,94 50,90 62,78 70,70" fill="none" stroke="#ffd27a" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 6"/>
    </g>
    <rect x="0.4" y="0.4" width="103.2" height="103.2" rx="22.6" fill="none" stroke="#6b2a2a" stroke-opacity="0.25" stroke-width="0.8"/>
  </g>
</svg>
