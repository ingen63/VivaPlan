[package]
name = "vivaplan-engine"
version.workspace = true
edition.workspace = true
# #43: Die Integrationstests sind ein einziges Programm (tests/all.rs), nicht eines je Datei. Das spart bei jedem
# Mutanten 24 Übersetzungen, Bindevorgänge und Programmstarts. Neue Testdateien in tests/all.rs eintragen.
autotests = false

[lib]
name = "engine"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars = "0.8"
rayon = "1"
calamine = { version = "0.38.0", default-features = false }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[[test]]
name = "all"
path = "tests/all.rs"
