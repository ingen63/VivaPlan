[package]
name = "vivaplan-engine"
version.workspace = true
edition.workspace = true
# #43: Die Integrationstests sind ein einziges Programm (tests/all.rs), nicht eines je Datei. Das spart bei jedem
# Mutanten 24 Übersetzungen, Bindevorgänge und Programmstarts. Neue Testdateien in tests/all.rs eintragen.
autotests = false

[lib]
name = "engine"

# #270: the desktop app and `vivaplan mcp` need an activation with a beta token. On by default until 1.0.0; to
# switch it off, remove it from `default`.
[features]
default = ["beta-token"]
beta-token = []

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars = "0.8"
rayon = "1"
calamine = { version = "0.38.0", default-features = false }
# #270: signature of the beta tokens (Ed25519); approved in #270.
ed25519-dalek = "2.1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[[test]]
name = "all"
path = "tests/all.rs"
